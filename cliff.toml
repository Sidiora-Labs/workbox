# git-cliff configuration for Workbox: https://git-cliff.org/docs/configuration
#
# `make changelog` prints a draft of the unreleased changes from git history; edit it into
# CHANGELOG.md when cutting a release. Commit subjects are plain sentences, so changes are grouped
# by their leading verb.

[changelog]
header = """
# Changelog

All notable changes to Workbox are documented in this file. The format is based on
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/).

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
### {{ entry.group | striptags | trim | upper_first }}
{% for commit in entry.commits | unique(attribute="message") -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | split(pat="\n") | first | trim | upper_first }} \
({{ commit.id | truncate(length=7, end="") }})
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true
render_always = false
postprocessors = []

[git]
conventional_commits = false
filter_unconventional = false
require_conventional = false
split_commits = false
commit_preprocessors = [
    # attribution trailers are not release notes
    { pattern = '(?m)^(Co-Authored-By|Signed-off-by|Claude-Session):.*$', replace = "" },
    # task tags are for the spec, not for readers
    { pattern = '[ \t]*\[spec:[^\]]+\]', replace = "" },
]
protect_breaking_commits = false
commit_parsers = [
    { message = "^(Merge|WIP) ", skip = true },
    { message = "^(Plan|Point|Record|Import|Mark)\\b", skip = true },
    { message = "^(Cover|Prove|Qualify)\\b", skip = true },
    { message = "^(Harden|Refuse|Guard|Deny|Close)\\b|\\bH[0-9]+\\b", group = "Security" },
    { message = "^(Fix|Restore)\\b", group = "Fixed" },
    { message = "^(Move|Mount|Rewrite|Make)\\b", group = "Changed" },
    { message = ".*", group = "Added" },
]
filter_commits = false
fail_on_unmatched_commit = false
link_parsers = []
use_branch_tags = false
topo_order = false
topo_order_commits = true
sort_commits = "newest"
recurse_submodules = false
