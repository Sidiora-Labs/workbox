name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches package.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected="$(node -p 'require("./package.json").version')"
          if [ "$version" != "$expected" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $expected" >&2
            exit 1
          fi
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" 'index($0, heading) == 1 {found = 1; next} found && /^## \[/ {exit} found' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Workbox $GITHUB_REF_NAME" \
            --notes-file notes.md "${prerelease[@]}"
