name: Feature request
description: Suggest a new feature or a change to Workbox.
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        For changes to the isolation boundary, the protocol, the REST or MCP interface, or the `wb` command set, please agree on the approach here before opening a pull request.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and the roadmap.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Isolation (namespaces, capabilities, seccomp, cgroups)
        - Network policy
        - wb command
        - Protocol
        - REST and WebSocket API
        - SDK
        - MCP server
        - Operator CLI
        - Deployment or documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Workbox does not support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work? Describe the behavior, inputs and outputs.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you considered, including existing `wb` commands or presets.
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and security
      description: Effects on existing interfaces or sandboxes, and any new access the feature would need.
